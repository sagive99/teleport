<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1b1033">
<title>Teleport</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    padding: 24px 16px;
    overflow-x: hidden;
    background: radial-gradient(circle at 50% 30%, #3b1d6e, #1b1033 70%);
    color: #fff3fb;
    font-family: "Courier New", monospace;
    text-align: center;
  }
  h1 { font-size: 22px; margin: 0; letter-spacing: 1px; }
  p { margin: 0; font-size: 18px; line-height: 1.4; max-width: 320px; }
  button {
    font: inherit;
    font-size: 20px;
    font-weight: bold;
    color: #1b1033;
    background: #ff8fc7;
    border: none;
    padding: 18px 28px;
    box-shadow: 0 6px 0 #b8457f;
    cursor: pointer;
    animation: glow 1.6s ease-in-out infinite;
  }
  button:active { transform: translateY(4px); box-shadow: 0 2px 0 #b8457f; }
  button:disabled { opacity: .6; animation: none; }
  @keyframes glow { 50% { box-shadow: 0 6px 0 #b8457f, 0 0 28px #ff8fc7; } }
  .small { font-size: 14px; opacity: .7; }
  .stage { position: relative; display: inline-block; }
  #art, #photo { image-rendering: pixelated; width: 288px; max-width: 80vw; height: auto; display: block; }
  #heart { position: absolute; left: 50%; top: -18px; width: 54px; margin-left: -27px; image-rendering: pixelated; animation: bob 1.2s ease-in-out infinite; z-index: 1; }
  @keyframes bob { 50% { transform: translateY(-10px) scale(1.1); } }
  .materialize { animation: materialize 1.1s steps(14) both; }
  @keyframes materialize {
    from { clip-path: inset(100% 0 0 0); filter: brightness(5) hue-rotate(90deg); }
    to { clip-path: inset(0); filter: none; }
  }
  .fx { position: fixed; pointer-events: none; z-index: 10; }
  .beam {
    top: 0; bottom: 0; left: 50%; width: 140px; margin-left: -70px;
    background: linear-gradient(90deg, transparent, #fff8, #ff8fc7, #fff, #ff8fc7, #fff8, transparent);
    animation: beam 1.1s ease-in forwards;
  }
  @keyframes beam {
    0% { transform: scaleX(0); opacity: 0; }
    40% { transform: scaleX(1); opacity: 1; }
    100% { transform: scaleX(0) scaleY(1.4); opacity: 0; }
  }
  .whiteout { inset: 0; background: #fff; animation: fade .6s ease-out forwards; }
  @keyframes fade { to { opacity: 0; } }
  .px { width: 8px; height: 8px; animation: fly var(--t) ease-out forwards; }
  @keyframes fly { to { transform: translate(var(--dx), var(--dy)) rotate(180deg); opacity: 0; } }
  .twinkle { position: absolute; width: 6px; height: 6px; background: #fff; animation: twinkle 1.4s steps(2) infinite; }
  @keyframes twinkle { 50% { opacity: 0; } }
  .shake { animation: shake .5s steps(8); }
  @keyframes shake {
    25% { transform: translate(-6px, 4px); }
    50% { transform: translate(5px, -5px); }
    75% { transform: translate(-4px, -3px); }
  }
  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: reduce) {
    *, .fx { animation: none !important; }
    .fx { display: none; }
  }
</style>
</head>
<body>

<section id="pick" hidden>
  <h1>Who are you?</h1>
  <p id="pickButtons" style="display:flex;gap:12px;margin-top:20px"></p>
</section>

<section id="home" hidden>
  <h1 id="homeTitle"></h1>
  <p style="margin:20px auto"><button id="go"></button></p>
  <p class="small" id="status"></p>
</section>

<section id="scene" hidden>
  <div class="stage" id="stage">
    <canvas id="heart" width="7" height="6"></canvas>
    <canvas id="art" width="32" height="20"></canvas>
    <img id="photo" alt="us" hidden>
  </div>
  <h1 id="sceneTitle" style="margin:24px 0 12px"></h1>
  <p id="sceneMsg" dir="auto" style="margin:0 auto"></p>
  <p class="small" style="margin:20px auto 0"><a href="" id="back" style="color:inherit">teleport again</a></p>
</section>

<script>
const ENGLISH = [
  'hi! i love you and miss you',
  'poof! here for a hug',
  'just wanted to be next to you for a sec',
  'you are my favorite place to teleport to',
  'counting the days until it is not pretend',
];

const PEOPLE = {
  sagiv: { name: 'Sagiv', topic: 'teleport-sagiv-f0da169d019c', lines: ENGLISH },
  her: {
    name: 'שחר',
    topic: 'teleport-her-b8d7f0162729',
    lines: [
      'שחריקה אני אוהב אותך ואני מתגעגע אלייך',
      'מאמיייי אני אוהב אותך הכי בעולם',
      'חיים שלי אני מתגעגע אלייך ואני רוצה לאכול אותך',
      'שחרקהההה איי לאביו',
    ],
  },
};

const ART = [];

const PALETTE = {
  H: '#3a2418', S: '#f2c6a0', E: '#1b1033', M: '#c4506a', W: '#f59ab0',
  B: '#4a7bd1', P: '#2d3a5c', K: '#222222', L: '#7a3f1d', D: '#e05c9a', R: '#ff4d8d',
};

const HIM = [
  '....HHHH....',
  '...HHHHHH...',
  '..HHHHHHHH..',
  '..HSSSSSSH..',
  '..SSESSESS..',
  '..SSSSSSSS..',
  '..SSSMMSSS..',
  '...SSSSSS...',
  '....SSSS....',
  '..BBBBBBBB..',
  '.BBBBBBBBBB.',
  '.SBBBBBBBBS.',
  '.SBBBBBBBBS.',
  '..BBBBBBBB..',
  '..PPP..PPP..',
  '..PPP..PPP..',
  '..KKK..KKK..',
];

const HER = [
  '....LLLL....',
  '..LLLLLLLL..',
  '.LLLLLLLLLL.',
  '.LLSSSSSSLL.',
  '.LSSESSESSL.',
  '.LSWSSSSWSL.',
  '.LSSSMMSSSL.',
  '.LLSSSSSSLL.',
  '.LL.SSSS.LL.',
  '.LDDDDDDDDL.',
  '.DDDDDDDDDD.',
  '.SDDDDDDDDS.',
  '.SDDDDDDDDS.',
  '.DDDDDDDDDD.',
  'DDDDDDDDDDDD',
  '...SS..SS...',
  '...KK..KK...',
];

const HEART = [
  '.RR.RR.',
  'RRRRRRR',
  'RRRRRRR',
  '.RRRRR.',
  '..RRR..',
  '...R...',
];

const FX_COLORS = ['#ff8fc7', '#ffffff', '#ffd36e', '#8fd3ff', '#ff4d8d'];

function draw(canvas, sprite, x, y) {
  const ctx = canvas.getContext('2d');
  sprite.forEach((row, dy) => [...row].forEach((c, dx) => {
    if (c === '.') return;
    ctx.fillStyle = PALETTE[c];
    ctx.fillRect(x + dx, y + dy, 1, 1);
  }));
}

const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
const wait = ms => new Promise(r => setTimeout(r, ms));
const pick = list => list[Math.floor(Math.random() * list.length)];

function store(key, value) {
  try {
    if (value === undefined) return localStorage.getItem(key);
    localStorage.setItem(key, value);
  } catch {}
  return null;
}

function pickLine(lines) {
  const last = store('lastLine');
  const line = pick(lines.length > 1 ? lines.filter(l => l !== last) : lines);
  store('lastLine', line);
  return line;
}

function nextArt() {
  const i = (Number(store('art')) + 1) % Math.max(ART.length, 1);
  store('art', i);
  return i;
}

function fx(className, ms, style = {}) {
  const el = document.createElement('div');
  el.className = `fx ${className}`;
  Object.assign(el.style, style);
  document.body.append(el);
  setTimeout(() => el.remove(), ms);
}

function burst(count) {
  const x = innerWidth / 2, y = innerHeight / 2;
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const dist = 80 + Math.random() * Math.max(innerWidth, innerHeight) / 2;
    const t = 600 + Math.random() * 700;
    fx('px', t, {
      left: `${x}px`, top: `${y}px`,
      background: pick(FX_COLORS),
      '--dx': `${Math.cos(angle) * dist}px`,
      '--dy': `${Math.sin(angle) * dist}px`,
      '--t': `${t}ms`,
    });
  }
}

async function warp() {
  document.body.classList.remove('shake');
  void document.body.offsetWidth;
  document.body.classList.add('shake');
  fx('beam', 1100);
  await wait(700);
  fx('whiteout', 600);
  burst(60);
}

function showScene(title, msg, artIndex) {
  $('pick').hidden = true;
  $('home').hidden = true;
  $('scene').hidden = false;
  $('sceneTitle').textContent = title;
  $('sceneMsg').textContent = msg;

  const art = $('art'), photo = $('photo');
  if (ART.length) {
    photo.src = ART[artIndex % ART.length];
    photo.hidden = false;
    art.hidden = true;
  } else {
    art.getContext('2d').clearRect(0, 0, art.width, art.height);
    draw(art, HIM, 3, 3);
    draw(art, HER, 17, 3);
  }
  draw($('heart'), HEART, 0, 0);

  const stage = $('stage');
  stage.querySelectorAll('.twinkle').forEach(t => t.remove());
  for (let i = 0; i < 8; i++) {
    const t = document.createElement('span');
    t.className = 'twinkle';
    Object.assign(t.style, {
      left: `${Math.random() * 100}%`, top: `${Math.random() * 100}%`,
      background: pick(FX_COLORS), animationDelay: `${Math.random() * 1.4}s`,
    });
    stage.append(t);
  }
  stage.classList.remove('materialize');
  void stage.offsetWidth;
  stage.classList.add('materialize');
}

async function teleport(me, them) {
  const sent = pickLine(PEOPLE[them].lines);
  const artIndex = nextArt();
  const back = `${location.origin}${location.pathname}?me=${them}&from=${me}&art=${artIndex}&msg=${encodeURIComponent(sent)}`;
  $('go').disabled = true;
  $('status').textContent = 'teleporting...';
  const send = fetch('https://ntfy.sh/', {
    method: 'POST',
    body: JSON.stringify({
      topic: PEOPLE[them].topic,
      title: `${PEOPLE[me].name} teleported to you!`,
      message: sent,
      tags: ['sparkling_heart'],
      click: back,
    }),
  }).then(res => { if (!res.ok) throw new Error(res.status); });
  try {
    await Promise.all([send, warp()]);
    await wait(250);
    showScene(`You teleported to ${PEOPLE[them].name}!`, me === 'sagiv' ? sent : pickLine(PEOPLE[me].lines), artIndex);
  } catch {
    $('status').textContent = 'teleporter broke :( check your internet and try again';
  } finally {
    $('go').disabled = false;
  }
}

async function start(me) {
  store('me', me);
  const them = Object.keys(PEOPLE).find(k => k !== me);
  $('pick').hidden = true;
  $('back').href = `?me=${me}`;
  const from = params.get('from');
  if (PEOPLE[from]) {
    warp();
    await wait(800);
    showScene(`${PEOPLE[from].name} teleported to you!`, params.get('msg') || pickLine(PEOPLE[me].lines), Number(params.get('art')) || 0);
    return;
  }
  $('home').hidden = false;
  $('homeTitle').textContent = `Hi ${PEOPLE[me].name}`;
  $('go').textContent = `Teleport to ${PEOPLE[them].name}`;
  $('go').onclick = () => teleport(me, them);
}

const me = [params.get('me'), store('me')].find(k => PEOPLE[k]);
if (me) {
  start(me);
} else {
  $('pick').hidden = false;
  for (const key of Object.keys(PEOPLE)) {
    const b = document.createElement('button');
    b.textContent = PEOPLE[key].name;
    b.onclick = () => start(key);
    $('pickButtons').append(b);
  }
}
</script>
</body>
</html>
